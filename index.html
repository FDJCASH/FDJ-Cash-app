<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Française des Jeux - Espace Cash & Loto</title>
    <style>
        :root {
            --bg-dark: #040812;
            --card-bg: rgba(15, 23, 42, 0.85);
            --accent-gold: #f59e0b;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh; overflow: hidden; background: radial-gradient(circle at 50% 0%, #064e3b 0%, #040812 70%); }
        .phone-container { width: 100%; max-width: 420px; height: 100%; max-height: 100vh; background: rgba(4, 8, 18, 0.95); display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .content-area { flex-grow: 1; overflow-y: auto; padding: 14px; box-sizing: border-box; }
        .screen { display: none; flex-direction: column; gap: 14px; }
        .screen.active { display: flex; }
        .card { background: var(--card-bg); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 18px; padding: 16px; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border-radius: 14px; border: none; font-weight: 800; font-size: 0.9rem; cursor: pointer; text-transform: uppercase; }
        .btn-green { background: #10b981; color: #fff; }
        input { width: 100%; padding: 13px; border-radius: 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 0.95rem; box-sizing: border-box; outline: none; margin-bottom: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="content-area">
            <!-- ÉCRAN DE CONNEXION SANS RISQUE DE FREEZE -->
            <div id="screen-auth" class="screen active">
                <div class="card" style="margin-top: 20px;">
                    <div style="text-align:center; font-size: 3rem; margin-bottom: 10px;">🏦</div>
                    <h2 style="margin-top:0; color: #fff; text-align:center;">Espace Joueur FDJ</h2>
                    <input type="email" id="log-email" placeholder="Adresse e-mail">
                    <input type="password" id="log-pwd" placeholder="Mot de passe">
                    <button class="btn btn-green" onclick="app.connexion()">Connexion 🔒</button>
                </div>
            </div>

            <!-- ÉCRAN ACCUEIL -->
            <div id="screen-home" class="screen">
                <div class="card">
                    <h2 style="color: #34d399; margin-top:0;">Bienvenue !</h2>
                    <p>Ton espace joueur est bien chargé et opérationnel.</p>
                    <button class="btn btn-green" onclick="app.deconnexion()">Se Déconnecter 🚪</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const app = {
            init() {
                console.log("App initialisée sans blocage.");
                let saved = localStorage.getItem('fdj_session');
                if(saved) {
                    this.changerEcran('screen-home');
                }
            },
            connexion() {
                let email = document.getElementById('log-email').value.trim();
                if(!email) return alert("Entre un e-mail.");
                localStorage.setItem('fdj_session', email);
                this.changerEcran('screen-home');
            },
            deconnexion() {
                localStorage.removeItem('fdj_session');
                this.changerEcran('screen-auth');
            },
            changerEcran(screenId) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('screen active') || s.classList.remove('active'));
                document.getElementById(screenId).classList.add('active');
            }
        };

        // Lancement immédiat sécurisé
        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
</html>
