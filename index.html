<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Joueur FDJ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 500px, #0b1021 0%, #000411 70%);
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 24px;
            color: #38bdf8;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #38bdf8;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.4);
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        #tuto-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        #tuto-overlay.show {
            display: flex;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Espace Joueur FDJ</h2>
        
        <div class="input-group">
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" placeholder="votre.email@gmail.com">
        </div>

        <div class="input-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button class="btn" id="login-btn" onclick="connexion()">Connexion Sécurisée</button>
    </div>

    <div id="tuto-overlay">
        <div style="background: #1e293b; padding: 20px; border-radius: 12px; text-align: center;">
            <p>Bienvenue dans le tutoriel !</p>
            <button class="btn" onclick="document.getElementById('tuto-overlay').classList.remove('show')">Compris</button>
        </div>
    </div>

    <script>
        // Simulation d'objets et de méthodes pour éviter les erreurs de référence
        const userAccount = {};
        
        function userDB(cleanEmailKey) {
            return {
                set: function(data) {
                    // Logique d'écriture de la base de données
                }
            };
        }

        const db = typeof firebase !== 'undefined' ? firebase.database() : null;

        function ajouterBoutonAdmin() {
            console.log("Mode Administrateur activé.");
        }

        function retirerBoutonAdmin() {
            console.log("Mode Administrateur retiré.");
        }

        function updateUI() {
            // Mise à jour visuelle générale
        }

        function renderMissions() {
            // Affichage des missions
        }

        function verifierCoolDownMission() {
            // Vérification des délais
        }

        function chargerChatDoubsDepuisStorage() {
            // Chargement du chat
        }

        function connexion() {
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            
            if (!emailInput || !passwordInput) return;

            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const cleanEmailKey = email.replace(/\./g, '_');
            const timestr = new Date().toISOString();

            userAccount.logintime = timestr;
            userAccount.email = email;
            
            try {
                userDB(cleanEmailKey).set(userAccount);
            } catch (e) {
                console.error("Erreur base de données locale", e);
            }

            if (db) {
                try {
                    db.ref('users/' + cleanEmailKey).set(userAccount);
                    localStorage.setItem('fdj_users', JSON.stringify(window.users26 || {}));
                } catch (err) {
                    console.error("Erreur Firebase", err);
                }
            }

            window.currentUserName = email.split('@')[0];
            window.currentEmail = cleanEmailKey;
            window.sessionStartTimestamp = Date.now();
            localStorage.setItem('fdj_active_session', cleanEmailKey);

            // Gestion des privilèges administrateur
            if (email === "a.tartesse@gmail.com") {
                window.isAdmin = true;
                window.balance = 999999;
                window.level = 99;
                ajouterBoutonAdmin();
            } else {
                window.isAdmin = false;
                retirerBoutonAdmin();
            }

            // Mise à jour sécurisée des éléments de l'interface (DOM) avec vérification d'existence
            const profileName = document.getElementById('profile-name');
            if (profileName) {
                profileName.innerText = window.currentUserName;
            }

            const profileEmail = document.getElementById('profile-email');
            if (profileEmail) {
                profileEmail.innerText = window.currentEmail;
            }

            const chatUserName = document.getElementById('chat-user-name');
            if (chatUserName) {
                chatUserName.innerText = window.currentUserName.split(' ')[0];
            }

            const mainHeader = document.getElementById('main-header');
            if (mainHeader) {
                mainHeader.style.display = 'flex';
                mainHeader.style.background = 'linear-gradient(135deg, rgba(20, 30, 48, 0.95), rgba(36, 59, 85, 0.95))';
                mainHeader.style.borderRadius = '12px';
                mainHeader.style.padding = '12px 16px';
                mainHeader.style.boxShadow = '0 8px 32px 0 rgba(0, 0, 0, 0.37)';
            }

            const bottomNav = document.getElementById('bottom-nav');
            if (bottomNav) {
                bottomNav.style.display = 'flex';
                bottomNav.style.background = 'rgba(15, 23, 42, 0.9)';
                bottomNav.style.backdropFilter = 'blur(10px)';
                bottomNav.style.borderTop = '1px solid rgba(255, 255, 255, 0.1)';
            }

            // Exécution des fonctions de l'application
            updateUI();
            renderMissions();
            verifierCoolDownMission();
            chargerChatDoubsDepuisStorage();

            // Gestion du tutoriel et overlay
            const fduDone = localStorage.getItem('fdj_tuto_done_' + cleanEmailKey);
            const tutoOverlay = document.getElementById('tuto-overlay');
            if (tutoOverlay) {
                if (!fduDone && !window.isAdmin) {
                    tutoOverlay.classList.0?.add('show') || tutoOverlay.classList.add('show');
                }
            }
        }
    </script>
</body>
</html>
